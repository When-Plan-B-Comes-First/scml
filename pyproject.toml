[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scml"
version = "0.2.0"
description = "Structure-Centric Machine Learning (SC-ML): SCOPE, AdaBox, and SLCD."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ahmed Elmahdi" }]
keywords = ["clustering", "density-based", "clustering-metric", "machine-learning", "SCOPE", "AdaBox"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.4", "pandas>=1.3"]
reproduce = ["matplotlib>=3.4", "pandas>=1.3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://structurecentricml.com"
Repository = "https://github.com/When-Plan-B-Comes-First/scml"

[tool.setuptools.packages.find]
where = ["src"]
